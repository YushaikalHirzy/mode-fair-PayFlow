<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - PayFlow</title>
    <link rel="stylesheet" href="/sdk/payflow.css"/>
    <style>
        body { max-width: 960px; margin: 24px auto; padding: 0 16px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .tag { padding: 2px 6px; border-radius: 4px; font-size: 12px; }
        .SUCCESS { background: #e6f4ea; color: #137333; }
        .FAILED { background: #fce8e6; color: #a50e0e; }
        .PENDING { background: #e8f0fe; color: #174ea6; }
        .btn { background: #1f7aec; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; text-decoration: none; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    </head>
<body>
<div class="header">
    <h2>Welcome, <span th:text="${merchant.name}"></span></h2>
    <div>
        <a class="btn" href="/portal/settings">Settings</a>
        <a class="btn" href="/logout">Logout</a>
    </div>
    </div>

<h3>Transactions</h3>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Status</th>
            <th>Amount</th>
            <th>Customer</th>
            <th>Created</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="t : ${transactions}">
            <td th:text="${t.publicId}"></td>
            <td><span class="tag" th:classappend=" ${t.status}" th:text="${t.status}"></span></td>
            <td th:text="${#numbers.formatDecimal(t.amount,1,2)} + ' ' + ${t.currency}"></td>
            <td th:text="${t.customerEmail}"></td>
            <td th:text="${#temporals.format(t.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
    </tbody>
</table>

</body>
</html>
