<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PayFlow Demo Store</title>
    <link rel="stylesheet" href="/sdk/payflow.css"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 960px; margin: 24px auto; padding: 0 16px; }
        .product { display: flex; gap: 24px; align-items: center; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
        .btn { background: #1f7aec; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; }
        img { width: 200px; height: 200px; object-fit: cover; border-radius: 8px; }
        .muted { color: #666; font-size: 0.9em; }
        code { background: #f5f5f5; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
<h2>PayFlow Demo Store</h2>
<p class="muted">Test card: <code>4242 4242 4242 4242</code> | Expiry: any future <code>MM/YY</code> | CVV: <code>123</code></p>
<div class="product card">
    <img src="https://picsum.photos/seed/payflow/400/400" alt="Product">
    <div>
        <h3>Awesome Widget</h3>
        <p>$19.99</p>
        <button class="btn" id="buyBtn">Buy Now</button>
    </div>
    
</div>

<script src="/sdk/payflow.js"></script>
<script>
    const apiKey = "[[${demoApiKey}]]"; // populated if demo merchant exists
    document.getElementById('buyBtn').addEventListener('click', () => {
        PayFlow.open({
            amount: 19.99,
            currency: 'USD',
            apiKey: apiKey || prompt('Enter your API Key from Settings page:'),
            onResult: (res) => {
                if (res.status === 'SUCCESS') {
                    window.location.href = '/demo/confirmation?tid=' + res.transactionId;
                } else {
                    alert('Payment failed: ' + (res.message || 'Unknown error'));
                }
            }
        });
    });
</script>
</body>
</html>
